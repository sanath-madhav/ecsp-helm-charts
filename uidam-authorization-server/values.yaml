# Default values for uidam-authorization-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: arti.dev.ignite.harman.com:5061/ignite/uidam-authorization-server
  pullPolicy: IfNotPresent
  tag: "2.1.0-20260622-263"

imagePullSecrets:
  - name: artifactory
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000


securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Config Server Configuration
configServer:
  host: "http://config-server:8080/config/"
  enabled: false
  springConfigImport: "optional:classpath:tenant-default.properties"

logging:
  logLevel: "INFO"
  igniteLogLevel: "INFO"
  svcLogLevel: "INFO"
  storageLogLevel: "ERROR"
  springLogLevel: "ERROR"
  propLoadLogLevel: INFO
  graylog:
    enabled: "true"
    host: "graylog3-tcp.graylog.svc.cluster.local"
    port: "12201"
    neverBlockForGraylog: "true"

# Multi-tenant configuration
multiTenant:
  # Global tenant settings
  tenantIds: "ecsp,sdp"
  defaultTenant: "sdp"
  enabled: false
  
  # Tenant configuration validation
  configValidationEnabled: false
  dbNameValidationStrategy: "NONE"
  
  # Tenant-specific configurations
  tenants:
    ecsp:
      tenantId: "ecsp"
      tenantName: "ECSP"
      ui:
        logoPath: "/images/ecsp-logo.svg"
      user:
        signUpEnabled: true
      keyStore:
        keyAlias: "ecsp-uidam-auth-server"
        jwtKeyId: "845b3g-246m-8b5f-af5b-gh8c9922f14g"
      captcha:
        recaptchaVerifyUrl: "https://www.google.com/recaptcha/api/siteverify"
        recaptchaKeySite: "6LfjilkpAAAAAKhpGZwLlFIeTavaxs3ZeBCV2xcO"
      database:
        jdbc_url: "jdbc:postgresql://postgresql.ignite-core:5432/ecsp"
      mfa:
        mode: "CONDITIONAL"
        stepUpScopes: "ManageUsers"
        skipUsers: "admin,tenantadmin"
    
    sdp:
      tenantId: "sdp"
      tenantName: "SDP"
      externalIdpEnabled: true
      ui:
        logoPath: "/images/sdp-logo.svg"
      user:
        signUpEnabled: true
      keyStore:
        keyAlias: "sdp-uidam-auth-server"
        jwtKeyId: "845b3g-246m-8b5f-af5b-gh8c9922f14g"
      captcha:
        recaptchaVerifyUrl: "https://www.google.com/recaptcha/api/siteverify"
        recaptchaKeySite: "6LfjilkpAAAAAKhpGZwLlFIeTavaxs3ZeBCV2xcO"
      database:
        jdbc_url: "jdbc:postgresql://postgresql.ignite-core:5432/uidam_management"
      mfa:
        mode: "REQUIRED"
        skipUsers: "admin,tenantadmin"
    
    default:
      tenantId: "default"
      tenantName: "DEFAULT"
      jksEnabled: true
      externalIdpEnabled: false
      internalLoginEnabled: true
      externalIdpClientName: "federated-user-client"
      ui:
        logoPath: "/images/default-logo.svg"
      account:
        accountId: "default-001"
        accountName: "default"
        accountType: "Root"
        accountFieldEnabled: true
      client:
        accessTokenTtl: 3600
        idTokenTtl: 3600
        refreshTokenTtl: 3600
        authCodeTtl: 300
        oauthScopeCustomization: false
        authCodeScopelessUserScopes: true
        reuseRefreshToken: false
      user:
        captchaAfterInvalidFailures: 1
        captchaRequired: false
        maxAllowedLoginAttempts: 3
        defaultRole: "VEHICLE_OWNER"
        signUpEnabled: true
        jwtAdditionalClaimAttributes: "accountType, accountName"
      externalUrls:
        userManagementUrl: "http://uidam-user-management:8080"
        clientByClientIdEndpoint: "/v1/oauth2/client/{clientId}"
        userByUsernameEndpoint: "/v1/users/{userName}/byUserName"
        recoveryNotificationEndpoint: "/v1/users/{userName}/recovery/forgotpassword"
        updatePasswordUsingSecretEndpoint: "/v1/users/recovery/set-password"
        addUserEventsEndpoint: "/v1/users/{id}/events"
        selfCreateUserEndpoint: "/v1/users/self"
        passwordPolicyEndpoint: "/v1/users/password-policy"
        createFedratedUserEndpoint: "/v1/users/federated"
      keyStore:
        keyStoreFilename: "uidamauthserver.jks"
        keyAlias: "sdp-uidam-auth-server"
        keyType: "JKS"
        jwtPubKeyPem: "/app/uidam-pub-key-pem"
      cert:
        jwtPublicKey: "app.pub"
        jwtPrivateKey: "app.key"
        jwtKeyId: "default-845b3g-246m-8b5f-af5b-gh8c9922f14g"
      captcha:
        recaptchaVerifyUrl: "https://www.google.com/recaptcha/api/siteverify"
        recaptchaKeySite: "6LfjilkpAAAAAKhpGZwLlFIeTavaxs3ZeBCV2xcO"
      database:
        jdbc_url: "jdbc:postgresql://postgresql.ignite-core:5432/uidam_management"
      mfa:
        mfaAppName: "UIDAM"
        mode: "DISABLED"
        stepUpScopes: "UIDAMSystem,ManageUsers,ManageAccounts"
        skipUsers: "admin,tenantadmin"
        skipClients: ""
        skipAccounts: ""
        stepUpClients: ""
        stepUpAccounts: ""
      externalIdpRegisteredClients:
        - clientName: Google
          registrationId: google
          enabled: false
          clientId: 164934606922-5bmh2qqbnalohet2obvfavkierp2ulpj.apps.googleusercontent.com
          clientAuthenticationMethod: client_secret_basic
          scope: "openid, profile, email, address, phone"
          authorizationUri: "https://accounts.google.com/o/oauth2/v2/auth"
          tokenUri: "https://www.googleapis.com/oauth2/v4/token"
          userInfoUri: "https://www.googleapis.com/oauth2/v3/userinfo"
          userNameAttributeName: "sub"
          jwkSetUri: "https://www.googleapis.com/oauth2/v3/certs"
          tokenInfoSource: "FETCH_INTERNAL_USER"
          createUserMode: "CREATE_INTERNAL_USER"
          defaultUserRoles: "VEHICLE_OWNER"
          claimMappings: "firstName#given_name,lastName#family_name,email#email"
        - clientName: Github
          registrationId: github
          enabled: false
          clientId: 7d5a571e8340ee69b149
          clientAuthenticationMethod: client_secret_basic
          scope: read:user
          authorizationUri: https://github.com/login/oauth/authorize
          tokenUri: https://github.com/login/oauth/access_token
          userInfoUri: https://api.github.com/user
          userNameAttributeName: id
          jwkSetUri: https://www.googleapis.com/oauth2/v3/certs
          tokenInfoSource: FETCH_INTERNAL_USER
          createUserMode: "CREATE_INTERNAL_USER"
          defaultUserRoles: "VEHICLE_OWNER"
        - clientName: Cognito
          registrationId: cognito
          enabled: false
          clientId: 4ptvjrj39j9tar0nrgli7vcoi3
          clientAuthenticationMethod: client_secret_basic
          scope: openid,profile
          authorizationUri: https://test-domain-299.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUri: https://test-domain-299.auth.us-east-1.amazoncognito.com/oauth2/token
          userInfoUri: https://test-domain-299.auth.us-east-1.amazoncognito.com/oauth2/userInfo
          userNameAttributeName: sub
          jwkSetUri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_jRtxnXmK0/.well-known/jwks.json
          tokenInfoSource: FETCH_INTERNAL_USER
          createUserMode: "CREATE_INTERNAL_USER"
          defaultUserRoles: "VEHICLE_OWNER"
        - clientName: Azure
          registrationId: azure
          enabled: true
          clientId: 59d375db-1c7c-4fcd-8070-ac096fef69ec
          clientAuthenticationMethod: client_secret_post
          scope: openid
          authorizationUri: https://login.microsoftonline.com/f66b6bd3-ebc2-4f54-8769-d22858de97c5/oauth2/v2.0/authorize
          tokenUri: https://login.microsoftonline.com/f66b6bd3-ebc2-4f54-8769-d22858de97c5/oauth2/v2.0/token
          userInfoUri: https://graph.microsoft.com/oidc/userinfo
          userNameAttributeName: sub
          jwkSetUri: https://login.microsoftonline.com/f66b6bd3-ebc2-4f54-8769-d22858de97c5/discovery/v2.0/keys
          tokenInfoSource: FETCH_INTERNAL_USER
          createUserMode: "CREATE_INTERNAL_USER"
          defaultUserRoles: "VEHICLE_OWNER"

# Application Configuration
uidam:
  oauth2:
    tokenHashAlgorithm: "SHA-256"

# Security Configuration  
security:
  client:
    bcryptStrength: "high"

# UI Configuration
ui:
  templatePath: "classpath:/templates/"
  staticPath: "classpath:/static"

service:
  type: ClusterIP
  port: 9443

ingress:
  enabled: true
  className: alb
  groupName: ic
  scheme: internal
  targetType: ip
  inboundCidrs: []
  tls:
    enabled: true
    sslRedirect: false
  additionalAnnotations: {}
  hosts:
  - hostPrefix: uidam-authorization-server
    paths:
    - /

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

distributedTracing:
  enabled: false

environmentDomainName: local

vault:
  url: https://vault.infra:8200
  secretsEnginePath: secret

vault_init:
  enabled: "true"
  vault_server_ipaddress: "vault.infra"
  vault_server_port_number: "8200"
  vault_secret_folder: "uidam-authorization-server"
  vault_service_component_name: "uidam-authorization-server"
  secure_http: "true"

javaOpts: -Xms128m -Xmx512m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxMetaspaceSize=256m

postgres:
  # Infrastructure settings
  host: postgresql.ignite-core
  connection: postgresql
  port: 5432
  
  # Database names
  uidam_dbname: uidam_management
  
  # Connection pool settings
  max_pool_size: "30"
  max_idle_time: "0"
  
  # Database initializer
  initializer:
    image:
      repository: arti.dev.ignite.harman.com:5061/hctl/postgresql-initializer
      tag: 1.0.0-updateforschema-3dc4b4f
      pullPolicy: Always

server_servlet_session_timeout: "5m"
user_session_force_login: "true"

health:
  postgresdb:
    monitor:
      enabled: "true"
      restart_on_failure: "true"

# Health probes configuration
probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

metrics:
  basePath: "/actuator"
  prometheus:
    enabled: "true"
    path: /prometheus
    agent:
      port: "9100"
      port_exposed: "9100"

