apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uidam-authorization-server.fullname" . }}-postgresql-config
  labels: {{- include "uidam-authorization-server.labels" . | nindent 4 }}
data:
  uidam-authorization-server-postgres-config.yml: |
    roles:
      - role: "uidam_authorization_server_postgres_role"
        databases:
          - database: uidam_management
            privileges:
              - resource:
                  schema: "uidam"
                  type:   "schema"
                actions: ["usage","create"]
