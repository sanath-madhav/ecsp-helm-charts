apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uidam-authorization-server.fullname" . }}
  labels: {{- include "uidam-authorization-server.labels" . | nindent 4 }}
  annotations:
    vault.security.banzaicloud.io/mutate-configmap: "true"
data:
  # Global application settings aligned with application.properties
  SPRING_AUTH_PROXY_PORT_HTTPS: "9443"
  SPRING_AUTH_PROXY_PORT: "9000"
  SPRING_AUTH_PROXY_HOSTNAME: {{ (first .Values.ingress.hosts).hostPrefix }}.{{ .Values.environmentDomainName }}
  UIDAM_OAUTH2_TOKEN_HASH_ALGORITHM: {{ .Values.uidam.oauth2.tokenHashAlgorithm | quote }}
  SECURITY_CLIENT_BCRYPT_STRENGTH: {{ .Values.security.client.bcryptStrength | quote }}
  UI_TEMPLATE_PATH: {{ .Values.ui.templatePath | quote }}
  UI_STATIC_PATH: {{ .Values.ui.staticPath | quote }}

  # Config Server Configuration
  CONFIG_SERVER_HOST: {{ .Values.configServer.host | quote }}
  CONFIG_SERVER_ENABLED: {{ .Values.configServer.enabled | quote }}
  SPRING_CLOUD_CONFIG_ENABLED: {{ .Values.configServer.enabled | quote }}
  UIDAM_CONFIG_IMPORT: {{ .Values.configServer.springConfigImport | quote }}

  # Multi-tenant configuration (centralized using tenantIds)
  TENANT_MULTITENANT_ENABLED: {{ .Values.multiTenant.enabled | quote }}
  {{- if not .Values.configServer.enabled }}
  TENANT_IDS: {{ .Values.multiTenant.tenantIds | quote }}
  {{- end }}
  TENANT_DEFAULT: {{ .Values.multiTenant.defaultTenant | quote }}
  #DEFAULT_TENANT_ID: {{ .Values.multiTenant.defaultTenant | quote }}
  
  # Tenant configuration validation
  TENANT_CONFIG_VALIDATION_ENABLED: {{ .Values.multiTenant.configValidationEnabled | quote }}
  UIDAM_TENANT_CONFIG_DBNAME_VALIDATION: {{ .Values.multiTenant.dbNameValidationStrategy | quote }}
  
  # User Management Base URL
  USER_MANAGEMENT_ENV: "http://uidam-user-management:8080"
  
  # Graylog Configuration aligned with application.properties
  GRAYLOG_ENABLED: {{ .Values.logging.graylog.enabled | quote }}
  GRAYLOG_HOST: {{ .Values.logging.graylog.host | quote }}
  GRAYLOG_PORT: {{ .Values.logging.graylog.port | quote }}
  NEVER_BLOCK_FOR_GRAYLOG: {{ .Values.logging.graylog.neverBlockForGraylog | quote }}
  LOG_FOLDER: "logs/"
  LOG_LEVEL: {{ .Values.logging.logLevel | quote }}
  IGNITE_LOG_LEVEL: {{ .Values.logging.igniteLogLevel | quote }}
  SVC_LOG_LEVEL: {{ .Values.logging.svcLogLevel | quote }}
  STORAGE_LOG_LEVEL: {{ .Values.logging.storageLogLevel | quote }}
  SPRING_LOG_LEVEL: {{ .Values.logging.springLogLevel | quote }}
  PROP_LOAD_LOG_LEVEL: {{ .Values.logging.propLoadLogLevel | quote }}
  # Cache Configuration aligned with application.properties
  CACHE_EXPIRE_MINS: "60"
  CACHE_MAX_SIZE: "100"
  CACHE_CLIENT_IDS: "token-mgmt,device-mgmt"
  
  # Cleanup Job Configuration
  CLEANUP_JOB_BATCH_SIZE: "50000"
  CLEANUP_JOB_SCHEDULING_RATE_CRON: "0 0 */6 * * *"
  CLEANUP_JOB_SCHEDULING_RETRY_ATTEMPTS: "3"
  CLEANUP_TOKEN_EXPIRES_BEFORE_IN_DAYS: "1"
  
  # SSL/JKS Configuration
  JKS_ENABLED: "true"
  KEYSTORE_ALIAS: {{ .Values.tenant.keyStore.keyAlias | quote }}
  KEYSTORE_FILE_NAME: {{ .Values.tenant.keyStore.keyStoreFilename | quote}}
  KEYSTORE_PASS: vault:{{ .Values.vault.secretsEnginePath }}/data/{{ include "uidam-authorization-server.fullname" . }}#keystorePassword
  KEYSTORE_TYPE: {{ .Values.tenant.keyStore.keyType | quote}}
  
  # JWT Configuration
  JWT_PUBLIC_KEY: {{ .Values.tenant.cert.jwtPublicKey | quote }}
  JWT_PRIVATE_KEY: {{ .Values.tenant.cert.jwtPrivateKey | quote }}
  JWT_KEY_ID: {{ .Values.tenant.cert.jwtKeyId | quote }}
  JWT_PUBLIC_KEY_PEM_PATH: {{ .Values.tenant.keyStore.jwtPubKeyPem | quote }}
  
  # Global secrets from vault
  UIDAM_OAUTH2_TOKEN_HASH_SALT: vault:{{ .Values.vault.secretsEnginePath }}/data/{{ include "uidam-authorization-server.fullname" . }}#oauth2.tokenHashSalt
  
  # Database schema
  UIDAM_DEFAULT_DB_SCHEMA: {{ .Values.uidam.db_schema | default "uidam" | quote }}
  
  # Session configuration aligned with application.properties
  server_servlet_session_timeout: {{ .Values.server_servlet_session_timeout | default "5m" | quote }}
  user_session_force_login: {{ .Values.user_session_force_login | default "true" | quote }}
  
  # Health and monitoring configuration
  health_service_executor_initial_delay: "10000"
  health_service_retry_interval_millis: "120000"
  health_postgresdb_monitor_enabled: {{ .Values.health.postgresdb.monitor.enabled | default "false" | quote }}
  health_postgresdb_monitor_restart_on_failure: {{ .Values.health.postgresdb.monitor.restart_on_failure | default "false" | quote }}
  
  # CORS configuration aligned with application.properties
  cors_allowed_origin_patterns: "*.harmandev.com,*.harman.com,*configurator.harman.local:8080"
  cors_allowed_methods: "GET,HEAD,POST"
  
  # Logout redirect configuration
  LOGOUT_REDIRECT_WHITELISTED_CUSTOM_HOSTS: "localhost,127.0.0.1"
  
  # Essential database configuration (used in application.properties)
  POSTGRES_DATASOURCE: "jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.uidam_dbname }}"
  POSTGRES_USERNAME: vault:{{ .Values.vault.secretsEnginePath }}/data/{{ include "uidam-authorization-server.fullname" . }}#username
  POSTGRES_PASSWORD: vault:{{ .Values.vault.secretsEnginePath }}/data/{{ include "uidam-authorization-server.fullname" . }}#password

  POSTGRES_MAX_POOL_SIZE: {{ .Values.postgres.max_pool_size | quote }}
  POSTGRES_MAX_IDLE_TIME: {{ .Values.postgres.max_idle_time | quote }}
