apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uidam-user-management.fullname" . }}
  labels: {{- include "uidam-user-management.labels" . | nindent 4 }}
  annotations:
    vault.security.banzaicloud.io/mutate-configmap: "true"
data:
  JAVA_OPTS: {{ .Values.javaOpts }}
  PORT_HTTP: {{ .Values.service.port | quote }}

  # Config Server Configuration
  CONFIG_SERVER_HOST: {{ .Values.configServer.host | quote }}
  CONFIG_SERVER_ENABLED: {{ .Values.configServer.enabled | quote }}
  UIDAM_CONFIG_IMPORT: {{ .Values.configServer.springConfigImport | quote }}

  # Multi-Tenant Configuration
  TENANT_MULTITENANT_ENABLED: {{ .Values.multiTenant.enabled | quote }}
  {{- if not .Values.configServer.enabled }}
  TENANT_IDS: {{ .Values.multiTenant.tenantIds | quote }}
  {{- end }}
  #DEFAULT_TENANT: {{ .Values.multiTenant.defaultTenant | quote }}
  TENANT_DEFAULT: {{ .Values.multiTenant.defaultTenant | quote }}

  # Tenant configuration validation
  TENANT_CONFIG_VALIDATION_ENABLED: {{ .Values.multiTenant.configValidationEnabled | quote }}
  UIDAM_TENANT_CONFIG_DBNAME_VALIDATION: {{ .Values.multiTenant.dbNameValidationStrategy | quote }}

  POSTGRES_DATASOURCE: "jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.uidam_dbname }}"
  SDP_POSTGRES_DATASOURCE:  "jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.uidam_dbname }}"
  POSTGRES_USERNAME: vault:{{ .Values.vault.secretsEnginePath }}/data/{{ include "uidam-user-management.fullname" . }}#username
  POSTGRES_PASSWORD: vault:{{ .Values.vault.secretsEnginePath }}/data/{{ include "uidam-user-management.fullname" . }}#password
  SHOW_SQL: "false"
  LOGGING_LEVEL_ROOT: {{ .Values.logging.loggingLevelRoot | quote }}
  GRAYLOG_ENABLED: {{ .Values.logging.graylog.enable | quote }}
  GRAYLOG_HOST: {{ .Values.logging.graylog.host }}
  GRAYLOG_PORT: {{ .Values.logging.graylog.port | quote }}
  NEVER_BLOCK_FOR_GRAYLOG: {{ .Values.logging.graylog.neverBlockForGraylog | quote }}
  LOG_FOLDER: {{ .Values.logging.logFolder | quote }}
  LOG_LEVEL: {{ .Values.logging.logLevel | quote }}
  IGNITE_LOG_LEVEL: {{ .Values.logging.igniteLoglevel | quote }}
  SVC_LOG_LEVEL: {{ .Values.logging.svcLogLevel }}
  STORAGE_LOG_LEVEL: {{ .Values.logging.storageLogLevel }}
  SPRING_LOG_LEVEL: {{ .Values.logging.springLogLevel }}
  REGISTRY_COMMON_LOG_LEVEL: {{ .Values.logging.registryCommonLogLevel }}
  PROP_LOAD_LOG_LEVEL: {{ .Values.logging.propLoadLogLevel }}
  LOG_APPENDER: {{ .Values.logging.logAppender | quote }}

  ###API_GATEWAY_PROPERTIES###
  api_registry_enabled: {{ .Values.apiGateway.registryEnabled | quote }}
  api_security_enabled: {{ .Values.apiGateway.securityEnabled | quote }}
  api_gatewayUrls: {{ .Values.apiGateway.gatewayUrls | quote }}
  spring_application_version: "1.0"
  spring_application_name: "uidam-user-management"
  spring_application_servicename: "uidam-user-management.sw-platform"
  openapi_path_include: "/v1/users/self, /v1/users/filter, /v1/users/{id}, /v1/users, /v1/users/self/settings, /v1/users/self/settings/**, /*/v1/emailVerification/{userId}/isEmailVerified, /*/v1/emailVerification/{token}, /v1/oauth2/client/**, /v1/oauth2/client/{clientId}, /v1/oauth2/client, /v1/roles/**, /v1/roles/filter, /v1/roles/{name}, /v1/roles/rolesById, /v1/roles, /v1/scopes/**, /v1/scopes/{name}, /v1/scopes/filter,/v1/accounts,/v1/accounts/{id},/v1/accounts/filter,/v1/accounts/**, /v1/users/status, /v1/users/external/{id}, /v1/users/external, /v1/users/external/{id}, /v2/users/**, /v2/users/{id}, /v1/users/{userId}/accountRoleMapping, /v2/users/filter, /v1/users/self/recovery/resetpassword,/v1/password-policies/**"
  api_registry_service_name: {{ .Values.apiGateway.registryServiceName | quote }}
  api_gateway_service_name: {{ .Values.apiGateway.gatewayServiceName | quote }}
  api_gateway_caching_ttl: {{ .Values.apiGateway.cachingTtl | quote }}
  api_gateway_cachesize: {{ .Values.apiGateway.cacheSize | quote }}

   ####Users Domain Configuration####
  password_encoder: {{ .Values.passwordEncoder | quote }}
  PASSWORD_POLICY_UPDATE_INTERVAL_MS: {{ .Values.passwordPolicyUpdateIntervalMs | quote }}
  
  ###Notification Configs###
  notification_api_url: "http://notification-api-int-svc.data-platform:8080/v1/notifications/nonRegisteredUsers"
  notification_id: "uidamCustomEmailTemplate6"

  ####Email Verification Configuration ####
  email_verification_subject: "UIDAM Email Verification"
  email_verification_content: "Please verify your UIDAM account that is associated with 
  this email address.<br/><a href=%s>Verify My Email</a><br/>If clicking the button doesn't seem to work, you can copy 
  and paste the following link into your browser.<br/>%s"
 
  ###Vault Configuration###
  vault_enabled: {{ .Values.vault_init.enabled | quote }}
  vault_server_ipaddress: {{ .Values.vault_init.vault_server_ipaddress | quote }}
  vault_server_port_number: {{ .Values.vault_init.vault_server_port_number | quote }}
  vault_secret_folder: {{ .Values.vault_init.vault_secret_folder }}
  vault_service_component_name: {{ .Values.vault_init.vault_service_component_name | quote }}
  vault_server_secure_http: {{ .Values.vault_init.secure_http | quote }}

  ###DAO Configuration###
  health_postgresdb_monitor_enabled: {{ .Values.health.postgresdb.monitor.enabled | quote }}
  health_postgresdb_monitor_restart_on_failure: {{ .Values.health.postgresdb.monitor.restart_on_failure | quote}}
  postgres_max_pool_size: {{ .Values.postgres.max_pool_size | quote }}
  postgres_max_idle_time: {{ .Values.postgres.max_idle_time | quote }}
  postgres_create_retry_count: {{ .Values.postgres.create_retry_count | quote }}
  postgres_retry_delay: {{ .Values.postgres.retry_delay_ms | quote }}
  postgres_data_source_properties_cachePrepStmts: {{ .Values.postgres.data_source_properties.cachePrepStmts | quote }}
  postgres_data_source_properties_prepStmtCacheSize: {{ .Values.postgres.data_source_properties.prepStmtCacheSize | quote }}
  postgres_data_source_properties_prepStmtCacheSqlLimit: {{ .Values.postgres.data_source_properties.prepStmtCacheSqlLimit | quote }}
  postgres_connection_timeout_ms: {{ .Values.postgres.connection_timeout_ms | quote }}
  postgres_expected99thPercentileMs: {{ .Values.postgres.expected99thPercentileMs | quote }}
  postgresdb_metrics_enabled: {{ .Values.postgres.metrics.enabled | quote}}
  postgresdb_metrics_executor_shutdown_buffer_ms: {{ .Values.postgres.metrics.executor_shutdown_buffer_ms | quote }}
  postgresdb_metrics_thread_freq_ms: {{ .Values.postgres.metrics.thread.freq_ms | quote }}
  postgresdb_metrics_thread_initial_delay_ms: {{ .Values.postgres.metrics.thread.intial_delay_ms | quote }}

  UIDAM_AUTH_ADMIN_SCOPE: {{ .Values.uidam.auth.admin_scope }}
  UIDAM_DEFAULT_DB_SCHEMA: {{ .Values.uidam.db_schema }}

  ###Prometheus config
  
  metrics_prometheus_enabled: {{ .Values.metrics.prometheus.enabled | quote}}
  prometheus_agent_port: {{ .Values.metrics.prometheus.agent.port | quote }}
  prometheus_agent_port_exposed: {{ .Values.metrics.prometheus.agent.port_exposed | quote }}
  
  ###Datadog config
  
  metrics_datadog_enabled: {{ .Values.metrics.datadog.enabled | default "false" | quote }}
  metrics_datadog_apiKey: vault:{{ .Values.vault.secretsEnginePath }}/data/{{ include "uidam-user-management.fullname" . }}#datadog.apiKey
  metrics_datadog_applicationKey: vault:{{ .Values.vault.secretsEnginePath }}/data/{{ include "uidam-user-management.fullname" . }}#datadog.applicationKey
  metrics_datadog_descriptions: {{ .Values.metrics.datadog.descriptions | default "true" | quote }}
  metrics_datadog_uri: {{ .Values.metrics.datadog.uri | default "https://api.datadoghq.com" | quote }}
  metrics_datadog_step: {{ .Values.metrics.datadog.step | default "60s" | quote }}
  metrics_datadog_readTimeout: {{ .Values.metrics.datadog.readTimeout | default "10000" | quote }}
  metrics_datadog_connectTimeout: {{ .Values.metrics.datadog.connectTimeout | default "10000" | quote }}
  metrics_datadog_batchSize: {{ .Values.metrics.datadog.batchSize | default "20" | quote }}

  #general metrics tags
  management_metrics_tags_env: {{ .Values.metrics.tags.envName | default "dev" | quote }}
  management_metrics_tags_product: {{ .Values.metrics.tags.product | default "UIDAM" | quote }}
  management_metrics_tags_service: {{ .Values.metrics.tags.service | default "UIDAM-User-Management" | quote }}
