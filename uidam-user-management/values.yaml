# Default values for uidam-user-management.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: arti.dev.ignite.harman.com:5061/ignite/uidam-user-management
  pullPolicy: IfNotPresent
  tag: "2.1.0-20260622-124"


imagePullSecrets:
  - name: artifactory
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

# Config Server Configuration
configServer:
  host: "http://config-server:8080/config/"
  enabled: false
  springConfigImport: "optional:classpath:tenant-default.properties,optional:configserver:{{ .Values.configServer.host }}"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

environmentDomainName: local

multiTenant:
  # Global tenant settings
  tenantIds: "ecsp,sdp"
  defaultTenant: "sdp"
  enabled: false
  
  # Tenant configuration validation
  configValidationEnabled: false
  dbNameValidationStrategy: "NONE"
  
  # Tenant-specific configurations
  tenants:
    ecsp:
      tenantId: "ecsp"
      tenantName: "ECSP"
      database:
        jdbcUrl: "jdbc:postgresql://postgresql.ignite-core:5432/ecsp"
    
    sdp:
      tenantId: "sdp"
      tenantName: "SDP"
      database:
        jdbcUrl: "jdbc:postgresql://postgresql.ignite-core:5432/uidam_management"

    default:
      tenantId: "default"
      tenantName: "DEFAULT"
      account:
        accountName: "default"
        accountType: "Root"
      user:
        passwordEncoder: "SHA-256"
        maxAllowedLoginAttempts: 3
        isUserStatusLifeCycleEnabled: false
        externalUserPermittedRoles: "VEHICLE_OWNER"
        externalUserDefaultStatus: ""
        userDefaultAccountName: "userdefaultaccount"
        additionalAttrCheckEnabledForSignUp: false
        temporaryLockEnabled: true
        temporaryLockPeriodMinutes: 30
      auth:
        adminScope: "UIDAMSystem"
      emailVerification:
        enabled: false
        url: "https://api-gateway3.{{ .Values.environmentDomainName }}/default/v1/emailVerification/%s"
        notificationId: "UIDAM_USER_VERIFY_ACCOUNT"
        expDays: 7
        emailRegexPatternExclude: ""
        authServerResponseUrl: "https://uidam-authorization-server.{{ .Values.environmentDomainName }}/default/emailVerification/verify"
        emailLogoPath: "images/default-logo.svg"
        emailCopyright: "Copyright © 2023 HARMAN International. All Rights Reserved."
      notification:
        apiUrl: "http://notification-api-int-svc.data-platform:8080/v1/notifications/nonRegisteredUsers"
        notificationId: "uidamCustomEmailTemplate5"
        config:
          resolver: "internal"
          path: "classpath:/notification/uidam-notification-config.json"
        template:
          engine: "thymeleaf"
          format: "HTML"
          resolver: "CLASSPATH"
          prefix: "/notification/"
          suffix: ".html"
        email:
          provider: "internal"
          host: "smtp.gmail.com"
          port: "587"
          smtpAuth: "true"
          smtpStartTls: "true"
          smtpStartTlsRequired: "true"
          smtpSSLEnabled: "false"
          smtpDebug: "false"
      authServer:
        hostName: "https://uidam-authorization-server"
        tokenUrl: "/default/oauth2/token"
        revokeTokenUrl: "/default/revoke/revokeByAdmin"
        clientId: "token-mgmt"
      clientRegistration:
        defaultStatus: "approved"
        refreshTokenValidity: 3600
        accessTokenValidity: 3600
        authorizationCodeValidity: 300
        hashAlgorithm: "SHA-256"
      recovery:
        secretExpiresInMinutes: 15
        passwordRecoveryNotificationId: "UIDAM_USER_PASSWORD_RECOVERY"
        authServerResetResponseUrl: "https://uidam-authorization-server.{{ .Values.environmentDomainName }}/default/recovery/reset/"
      captcha:
        enforceAfterNoOfFailures: 1
      mfa:
        mfaAppName: "UIDAM"
        backupCodesEnabled: false
        backupCodesCount: 8
      database:
        jdbcUrl: "jdbc:postgresql://postgresql.ignite-core:5432/uidam_management"
        maxPoolSize: 30
        maxIdleTime: 0
        connectionTimeoutMs: 60000
        defaultSchema: "uidam"
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
      liquibase:
        changeLog: "classpath:database.schema/master.xml"
        defaultSchema: "uidam"
        parametersSchema: "uidam"

distributedTracing:
  enabled: false

vault:
  url: https://vault.infra:8200
  secretsEnginePath: secret

javaOpts: -Xms128m -Xmx512m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxMetaspaceSize=256m

logging:
  level: INFO
  loggingLevelRoot: "INFO"
  graylog:
    enable: "true"
    host: graylog3-tcp.graylog.svc.cluster.local
    port: "12201"
    neverBlockForGraylog: "true"
  logFolder: "logs/"
  logLevel: "INFO"
  igniteLoglevel: "INFO"
  svcLogLevel: INFO
  storageLogLevel: ERROR
  springLogLevel: ERROR
  registryCommonLogLevel: INFO
  propLoadLogLevel: INFO
  logAppender: "ASYNC-GELF"

apiGateway:
  registryEnabled: "true"
  securityEnabled: "false"
  gatewayUrls: "https://api-gateway3.{{ .Values.environmentDomainName }}/"
  registryServiceName: "http://api-registry-int-svc.data-platform"
  gatewayServiceName: "http://api-gateway3-int-svc.data-platform"
  cachingTtl: "10"
  cacheSize: "50"

passwordEncoder: "SHA-256"

passwordPolicyUpdateIntervalMs: "60000"

postgres:
  # Infrastructure settings
  host: postgresql.ignite-core
  connection: postgresql
  port: 5432
  
  # Database names
  default_dbname: postgresql
  uidam_dbname: uidam_management
  
  # Connection pool settings
  max_pool_size: "30"
  max_idle_time: "0"
  connection_timeout_ms: "60000"
  expected99thPercentileMs: "60000"
  
  # Connection retry settings
  create_retry_count: '3'
  retry_delay_ms: '30'
  
  # Data source properties
  data_source_properties:
    cachePrepStmts: "true"
    prepStmtCacheSize: "250"
    prepStmtCacheSqlLimit: "2048"
  
  # Vault integration
  vault:
    enabled: "true"
    leaseIntervalGap: "300000"
    refreshCheckInterval: "60000"
  
  # Database initializer
  initializer:
    image:
      repository: arti.dev.ignite.harman.com:5061/hctl/postgresql-initializer
      tag: 1.0.0-updateforschema-3dc4b4f
      pullPolicy: Always
  
  # Metrics configuration
  metrics:
    enabled: "false"
    executor_shutdown_buffer_ms: "2000"
    thread:
      freq_ms: "5000"
      intial_delay_ms: "2000"

vault_init:
  enabled: "true"
  vault_server_ipaddress: "vault.infra"
  vault_server_port_number: "8200"
  vault_secret_folder: "uidam-user-management"
  vault_service_component_name: "uidam-user-management"
  secure_http: "true"

health:
  vault:
    monitor:
      enabled: "true"
    needs_restart_on_failure: "true"
  postgresdb:
    monitor:
      enabled: "false"
      restart_on_failure: "false"

# Health probes configuration
probes:
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

metrics:
  basePath: "/actuator"
  prometheus:
    enabled: "true"
    path: /prometheus
    agent:
      port: "9100"
      port_exposed: "9100"
  datadog:
    enabled: "false"
    uri: "https://api.datadoghq.eu"
    apiKey: "*******"
    applicationKey: "********"
    descriptions: "true"
    readTimeout: "5s"
    connectTimeout: "5s"
    batchSize: "1000"
    step: "1m"
  tags:
    envName: "dev"
    product: "UIDAM"
    service: "UIDAM-User-Managment"

uidam:
  auth:
    admin_scope: "UIDAMSystem"
  db_schema: "uidam"

## notification config
notification:
  # email_provider "internal" for spring mail
  # email_provider "ignite" for notification center
  email:
    provider: "internal"
    host: "email-smtp.us-east-1.amazonaws.com"
    port: "587"
    smptAuth: "true"
    smptStartTls: "true"
    smptStartTlsRequired: "true"
    smptSSLEnabled: "false"
    smtpDebug: "false"
    overrideSender: "admin@harman.com" # this will override the from email available in notification config
    # if enabled will overrride the email provider host,port in the template
    mailingService:
      enabled: false
      url: mailing-service
      port: "587"
  config:
    createDefault: true
    configName: "uidam-user-management-notification-config"
    resolver: "internal"
    path: "file:/notification/uidam-user-management-notification-config.json"
  # notification template configuration
  template:
     # thymeleaf and mustache template engines are supported
    engine: "thymeleaf"
    format: "HTML" # HTML, TEXT
    prefix: "/notification/" # path prefix for template
    resolver: "CLASSPATH" # valid values: CLASSPATH, FILE, URL
    suffix: ".html"
